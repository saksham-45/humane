<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
<style>
  @media (prefers-reduced-motion: no-preference) {
    .idle { animation: face-flicker 0.88s steps(1, end) infinite; }
    .lid { animation: blink 2.8s steps(1, end) infinite; animation-delay: 0.7s; }
  }
  .lid { opacity: 0; }
  @keyframes blink {
    0%, 88%, 100% { opacity: 0; }
    90%, 94% { opacity: 1; }
  }
  @keyframes face-flicker {
    0%, 100% { opacity: 1; }
    6% { opacity: 0.82; }
    8% { opacity: 1; }
    40% { opacity: 1; }
    43% { opacity: 0.88; }
    45% { opacity: 1; }
    72% { opacity: 1; }
    74% { opacity: 0.9; }
    76% { opacity: 1; }
  }
</style>
