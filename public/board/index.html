<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Board — HUMANE</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body data-page="board">
    <div class="desk">
      <header class="top">
        <a class="mark" href="/">HUMANE</a>
        <nav>
          <a href="/play">Play</a>
          <a href="/board" aria-current="page">Board</a>
          <a href="/name">Name</a>
        </nav>
      </header>
      <h1>Current ink.</h1>
      <p class="lede">Ranked by streak, then longest, then the earliest correct cut today.</p>
      <div class="empty" hidden>
        <h1>No names on the paper.</h1>
        <p>The board waits for a claimed streak. <a href="/name">Take a name</a>, then cut.</p>
      </div>
      <table class="board">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Now</th>
            <th>Best</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="meta" id="you" hidden></p>
    </div>
    <script src="/js/app.js" defer></script>
  </body>
</html>
