<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HUMANE — board</title>
    <meta name="theme-color" content="#124DA5" />
    <link rel="icon" href="/img/favicon.svg?v=face-1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/favicon.svg?v=face-1" />
    <link rel="stylesheet" href="/css/app.css?v=board-scroll-1" />
    <link rel="stylesheet" href="/js/play-table.css?v=board-scroll-1" />
  </head>
  <body class="board-page">
    <div class="floor" id="board-root">
      <p id="fixture-note" class="fixture-note" hidden>
        Layout fixture — /api not mounted. Not a second API.
      </p>

      <header class="strip">
        <a class="wordmark" href="/" aria-label="HUMANE">
          <img class="logo-gif" src="/img/logo.gif" width="220" height="52" alt="HUMANE" />
        </a>
        <div class="you-chip" id="you-chip" hidden>
          <img id="you-face" class="ink-face" src="/avatars/ink-0.gif" width="48" height="48" alt="" />
          <span id="you-name" class="you-name">—</span>
        </div>
        <div class="score-block">
          <span class="score-label">SCORE</span>
          <span id="score-today" class="score-num">0</span>
        </div>
      </header>

      <div class="round-bar">
        <span class="clock" aria-hidden="true"><span class="clock-hand"></span></span>
        <span class="round-read" id="today-line">today</span>
        <a class="prompt linkish" href="/play/">PLAY</a>
      </div>

      <main class="board-stage">
        <section class="board-col sketch-panel">
          <h1>Today</h1>
          <ol class="board-list" id="list-today"></ol>
        </section>
        <section class="board-col sketch-panel">
          <h1>All-time</h1>
          <ol class="board-list" id="list-alltime"></ol>
        </section>
      </main>

      <section class="comments sketch-panel" id="comments-wrap">
        <h1>Notes</h1>
        <ol class="comment-list" id="comment-list"></ol>
        <form class="comment-form" id="comment-form">
          <label class="sr" for="comment-body">Write a note</label>
          <textarea id="comment-body" maxlength="160" rows="3" placeholder="leave a note"></textarea>
          <button class="sketch-btn" id="comment-send" type="submit">Post</button>
          <p class="door-err" id="comment-err" hidden></p>
          <p class="comment-hint" id="comment-hint" hidden>Take a name on the door first.</p>
        </form>
      </section>
    </div>
    <script type="module" src="/js/board.js?v=score-1"></script>
  </body>
</html>
