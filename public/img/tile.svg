<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 350 350" shape-rendering="crispEdges">
  <rect width="350" height="350" fill="#124DA5"/>
  <g fill="#0B3A82">
    <!-- quill -->
    <rect x="22" y="18" width="4" height="28"/>
    <rect x="18" y="42" width="12" height="4"/>
    <rect x="26" y="14" width="8" height="8"/>
    <!-- two paper columns -->
    <rect x="70" y="16" width="18" height="26"/>
    <rect x="92" y="16" width="18" height="26"/>
    <rect x="74" y="20" width="10" height="2" fill="#0A326F"/>
    <rect x="74" y="26" width="10" height="2" fill="#0A326F"/>
    <rect x="96" y="20" width="10" height="2" fill="#0A326F"/>
    <rect x="96" y="26" width="10" height="2" fill="#0A326F"/>
    <!-- stamp -->
    <rect x="140" y="22" width="22" height="18"/>
    <rect x="144" y="26" width="14" height="10" fill="#0A326F"/>
    <!-- H -->
    <rect x="186" y="16" width="6" height="24"/>
    <rect x="202" y="16" width="6" height="24"/>
    <rect x="192" y="26" width="10" height="6"/>
    <!-- tiny face -->
    <rect x="230" y="18" width="20" height="20"/>
    <rect x="234" y="24" width="4" height="4" fill="#0A326F"/>
    <rect x="242" y="24" width="4" height="4" fill="#0A326F"/>
    <rect x="236" y="30" width="8" height="3" fill="#0A326F"/>
    <!-- book -->
    <rect x="276" y="20" width="28" height="20"/>
    <rect x="289" y="20" width="2" height="20" fill="#0A326F"/>
    <!-- pencil -->
    <rect x="24" y="88" width="6" height="28"/>
    <rect x="24" y="82" width="6" height="6"/>
    <rect x="26" y="116" width="2" height="6"/>
    <!-- letter -->
    <rect x="72" y="90" width="24" height="16"/>
    <rect x="76" y="94" width="16" height="2" fill="#0A326F"/>
    <rect x="76" y="100" width="10" height="2" fill="#0A326F"/>
    <!-- ink pot -->
    <rect x="130" y="96" width="16" height="14"/>
    <rect x="134" y="90" width="8" height="8"/>
    <!-- plus -->
    <rect x="178" y="96" width="16" height="6"/>
    <rect x="183" y="91" width="6" height="16"/>
    <!-- stacked pages -->
    <rect x="226" y="88" width="22" height="6"/>
    <rect x="230" y="96" width="22" height="6"/>
    <rect x="226" y="104" width="22" height="6"/>
    <!-- smile -->
    <rect x="286" y="90" width="22" height="22"/>
    <rect x="292" y="96" width="3" height="3" fill="#0A326F"/>
    <rect x="299" y="96" width="3" height="3" fill="#0A326F"/>
    <rect x="292" y="104" width="10" height="3" fill="#0A326F"/>
    <!-- rule -->
    <rect x="18" y="168" width="40" height="4"/>
    <rect x="18" y="178" width="28" height="4"/>
    <!-- card pair -->
    <rect x="80" y="160" width="16" height="22"/>
    <rect x="100" y="160" width="16" height="22"/>
    <!-- caret -->
    <rect x="150" y="164" width="4" height="18"/>
    <rect x="154" y="164" width="10" height="4"/>
    <!-- coin / score pip -->
    <rect x="196" y="166" width="16" height="16"/>
    <rect x="200" y="170" width="8" height="8" fill="#0A326F"/>
    <!-- folded note -->
    <rect x="240" y="162" width="20" height="16"/>
    <rect x="252" y="162" width="8" height="8" fill="#0A326F"/>
    <!-- tally -->
    <rect x="290" y="160" width="3" height="20"/>
    <rect x="297" y="160" width="3" height="20"/>
    <rect x="304" y="160" width="3" height="20"/>
    <rect x="311" y="160" width="3" height="20"/>
    <rect x="288" y="176" width="28" height="3"/>
    <!-- typewriter keys -->
    <rect x="26" y="230" width="10" height="10"/>
    <rect x="40" y="230" width="10" height="10"/>
    <rect x="54" y="230" width="10" height="10"/>
    <rect x="33" y="244" width="10" height="10"/>
    <rect x="47" y="244" width="10" height="10"/>
    <!-- paragraph -->
    <rect x="90" y="228" width="28" height="4"/>
    <rect x="90" y="236" width="28" height="4"/>
    <rect x="90" y="244" width="20" height="4"/>
    <!-- glasses -->
    <rect x="148" y="234" width="12" height="10"/>
    <rect x="168" y="234" width="12" height="10"/>
    <rect x="160" y="236" width="8" height="3"/>
    <!-- star -->
    <rect x="210" y="230" width="6" height="18"/>
    <rect x="204" y="236" width="18" height="6"/>
    <!-- envelope -->
    <rect x="250" y="230" width="26" height="18"/>
    <rect x="250" y="230" width="26" height="3"/>
    <rect x="260" y="236" width="6" height="6" fill="#0A326F"/>
    <!-- small H again -->
    <rect x="304" y="228" width="4" height="18"/>
    <rect x="316" y="228" width="4" height="18"/>
    <rect x="308" y="235" width="8" height="4"/>
    <!-- bottom row doodles -->
    <rect x="20" y="300" width="24" height="6"/>
    <rect x="20" y="310" width="16" height="6"/>
    <rect x="64" y="296" width="8" height="24"/>
    <rect x="60" y="316" width="16" height="6"/>
    <rect x="110" y="300" width="20" height="20"/>
    <rect x="116" y="306" width="8" height="8" fill="#0A326F"/>
    <rect x="160" y="304" width="28" height="8"/>
    <rect x="168" y="296" width="12" height="24"/>
    <rect x="216" y="300" width="6" height="22"/>
    <rect x="228" y="300" width="6" height="22"/>
    <rect x="216" y="308" width="18" height="6"/>
    <rect x="268" y="298" width="22" height="16"/>
    <rect x="272" y="302" width="14" height="3" fill="#0A326F"/>
    <rect x="310" y="304" width="16" height="16"/>
  </g>
</svg>
