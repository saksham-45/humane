<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUMANE</title>
    <link rel="stylesheet" href="/css/app.css?v=skribbl-door" />
  </head>
  <body class="door">
    <div class="floor">
      <div class="stack">
        <h1 class="wordmark" aria-label="HUMANE">
          <span class="c0">H</span><span class="c1">U</span><span class="c2">M</span><span class="c3">A</span><span class="c4">N</span><span class="c5">E</span>
        </h1>
        <div class="booth">
          <form id="door-form" class="door-form">
            <div class="namelang">
              <label class="sr" for="username">enter your name</label>
              <input id="username" name="username" type="text" maxlength="16" autocomplete="username" spellcheck="false" placeholder="enter your name" />
              <label class="sr" for="lang">language</label>
              <select id="lang" name="lang" aria-label="language">
                <option selected>English</option>
              </select>
            </div>
            <div class="well">
              <div class="hits left">
                <button type="button" class="hit" id="l0" aria-label="Face up">▲</button>
                <button type="button" class="hit" id="l1" aria-label="Face mid">▲</button>
                <button type="button" class="hit" id="l2" aria-label="Face down">▼</button>
              </div>
              <button type="button" class="face-hit" id="face-hit" aria-label="Avatar">
                <img id="face-img" width="96" height="96" alt="" />
              </button>
              <div class="hits right">
                <button type="button" class="hit" id="r0" aria-label="Next up">▲</button>
                <button type="button" class="hit" id="r1" aria-label="Next mid">▲</button>
                <button type="button" class="hit" id="r2" aria-label="Next down">▼</button>
              </div>
              <button type="button" class="shuffle" id="shuffle" aria-label="Shuffle">↻</button>
            </div>
            <input type="hidden" id="avatar" name="avatar" value="ink-0" />
            <button class="play" id="play" type="submit" disabled>Play!</button>
            <a class="board-btn" href="/board">Board</a>
          </form>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var faces = [];
        for (var i = 0; i < 12; i++) faces.push("ink-" + i);
        var idx = 0;
        var input = document.getElementById("username");
        var play = document.getElementById("play");
        var hidden = document.getElementById("avatar");
        var faceImg = document.getElementById("face-img");
        var form = document.getElementById("door-form");

        function src(id) { return "/avatars/" + id + ".svg"; }
        function fallback(id) { return "/img/" + id + ".svg"; }
        function valid(name) { return /^[a-z0-9_]{3,16}$/i.test(name.trim()); }
        function paint() {
          var id = faces[idx];
          hidden.value = id;
          faceImg.onerror = function () {
            faceImg.onerror = null;
            faceImg.src = fallback(id);
          };
          faceImg.src = src(id);
        }
        function syncPlay() { play.disabled = !valid(input.value); }
        function shake() {
          input.classList.remove("shake");
          void input.offsetWidth;
          input.classList.add("shake");
        }
        function step(d) {
          idx = (idx + d + 12) % 12;
          paint();
        }
        ["l0", "l1", "l2"].forEach(function (id) {
          document.getElementById(id).addEventListener("click", function () { step(-1); });
        });
        ["r0", "r1", "r2"].forEach(function (id) {
          document.getElementById(id).addEventListener("click", function () { step(1); });
        });
        document.getElementById("shuffle").addEventListener("click", function () {
          idx = Math.floor(Math.random() * 12);
          paint();
        });
        document.getElementById("face-hit").addEventListener("click", function () {
          this.classList.remove("pop");
          void this.offsetWidth;
          this.classList.add("pop");
        });
        input.addEventListener("input", syncPlay);
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          if (!valid(input.value)) { shake(); return; }
          play.disabled = true;
          fetch("/api/claim", {
            method: "POST",
            credentials: "same-origin",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username: input.value.trim(), avatar: hidden.value }),
          })
            .then(function (r) { return r.json(); })
            .then(function (out) {
              if (out && !out.error && (out.username || out.ok !== false)) {
                location.href = "/play/";
                return;
              }
              play.disabled = false;
              shake();
            })
            .catch(function () {
              play.disabled = false;
              location.href = "/play/";
            });
        });
        fetch("/api/me", { credentials: "same-origin" })
          .then(function (r) { return r.json(); })
          .then(function (me) {
            if (me && me.username) {
              input.value = me.username;
              var n = faces.indexOf(me.avatar);
              if (n >= 0) idx = n;
            }
            paint();
            syncPlay();
          })
          .catch(function () {
            paint();
            syncPlay();
          });
      })();
    </script>
  </body>
</html>
