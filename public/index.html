<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUMANE</title>
    <meta name="description" content="Name, face, play. Five cuts a day." />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="door">
    <div class="floor">
      <div class="booth">
        <h1 class="wordmark" aria-label="HUMANE">
          <span>H</span><span>U</span><span>M</span><span>A</span><span>N</span><span class="e-hold">E<img id="logo-face" class="logo-face" width="32" height="32" alt="" /></span>
        </h1>
        <form id="door-form" class="door-form" autocomplete="on">
          <label class="sr" for="username">enter your name</label>
          <input id="username" name="username" type="text" maxlength="16" autocomplete="username" spellcheck="false" placeholder="enter your name" />
          <div class="picker">
            <button type="button" class="arrow" id="prev" aria-label="Previous face">‹</button>
            <button type="button" class="face-hit" id="face-hit" aria-label="Avatar">
              <img id="face-img" width="96" height="96" alt="" />
            </button>
            <button type="button" class="arrow" id="next" aria-label="Next face">›</button>
            <button type="button" class="shuffle" id="shuffle" aria-label="Shuffle face">*</button>
          </div>
          <input type="hidden" id="avatar" name="avatar" value="ink-0" />
          <button class="play" id="play" type="submit" disabled>PLAY!</button>
        </form>
        <p class="door-nav"><a href="/board">board</a><span>·</span><a href="/about">how</a></p>
      </div>
    </div>
    <footer class="band">
      <div class="band-grid">
        <section>
          <h2>About</h2>
          <p>Two columns. One still has a person in it. Five a day.</p>
        </section>
        <section>
          <h2>How</h2>
          <p>Name. Face. Play. Pick the human. +1 if you’re right.</p>
        </section>
        <section>
          <h2>Today</h2>
          <div class="stamps" aria-label="Today’s five">
            <span>I</span><span>II</span><span>III</span><span>IV</span><span>V</span>
          </div>
        </section>
      </div>
    </footer>
    <script>
      (function () {
        var faces = [];
        for (var i = 0; i < 12; i++) faces.push("ink-" + i);
        var idx = 0;
        var input = document.getElementById("username");
        var play = document.getElementById("play");
        var hidden = document.getElementById("avatar");
        var faceImg = document.getElementById("face-img");
        var logoFace = document.getElementById("logo-face");
        var form = document.getElementById("door-form");

        function src(id) {
          return "/avatars/" + id + ".svg";
        }
        function fallback(id) {
          return "/img/" + id + ".svg";
        }
        function valid(name) {
          return /^[a-z0-9_]{3,16}$/i.test(name.trim());
        }
        function paint() {
          var id = faces[idx];
          hidden.value = id;
          faceImg.onerror = function () {
            faceImg.onerror = null;
            faceImg.src = fallback(id);
          };
          logoFace.onerror = function () {
            logoFace.onerror = null;
            logoFace.src = fallback(id);
          };
          faceImg.src = src(id);
          logoFace.src = src(id);
          logoFace.classList.remove("bounce");
          void logoFace.offsetWidth;
          logoFace.classList.add("bounce");
        }
        function syncPlay() {
          play.disabled = !valid(input.value);
        }
        function shake() {
          input.classList.remove("shake");
          void input.offsetWidth;
          input.classList.add("shake");
        }
        document.getElementById("prev").addEventListener("click", function () {
          idx = (idx + 11) % 12;
          paint();
        });
        document.getElementById("next").addEventListener("click", function () {
          idx = (idx + 1) % 12;
          paint();
        });
        document.getElementById("shuffle").addEventListener("click", function () {
          idx = Math.floor(Math.random() * 12);
          paint();
        });
        document.getElementById("face-hit").addEventListener("click", function () {
          this.classList.remove("pop");
          void this.offsetWidth;
          this.classList.add("pop");
        });
        input.addEventListener("input", syncPlay);
        play.addEventListener("click", function (ev) {
          if (play.disabled) {
            ev.preventDefault();
            shake();
          }
        });
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          if (!valid(input.value)) {
            shake();
            return;
          }
          play.disabled = true;
          fetch("/api/claim", {
            method: "POST",
            credentials: "same-origin",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username: input.value.trim(), avatar: hidden.value }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (out) {
              if (out && (out.username || out.ok !== false) && !out.error) {
                location.href = "/play/";
                return;
              }
              play.disabled = false;
              shake();
            })
            .catch(function () {
              play.disabled = false;
              location.href = "/play/";
            });
        });
        fetch("/api/me", { credentials: "same-origin" })
          .then(function (r) {
            return r.json();
          })
          .then(function (me) {
            if (me && me.username) {
              input.value = me.username;
              var n = faces.indexOf(me.avatar);
              if (n >= 0) idx = n;
            }
            paint();
            syncPlay();
          })
          .catch(function () {
            paint();
            syncPlay();
          });
      })();
    </script>
  </body>
</html>
