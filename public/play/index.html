<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HUMANE — play</title>
    <meta name="theme-color" content="#124DA5" />
    <link rel="icon" href="/img/favicon.svg?v=face-1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/favicon.svg?v=face-1" />
    <link rel="stylesheet" href="/css/app.css?v=mobile-2" />
    <link rel="stylesheet" href="/js/play-table.css?v=mobile-2" />
  </head>
  <body class="play-table">
    <div class="floor" id="play-root">
      <p id="fixture-note" class="fixture-note" hidden>
        Layout fixture — /api not mounted. Not a second API.
      </p>

      <header class="strip">
        <a class="wordmark" href="/" aria-label="HUMANE">
          <img class="logo-gif" src="/img/logo.gif" width="220" height="52" alt="HUMANE" />
        </a>
        <div class="you-chip" id="you-chip">
          <img id="you-face" class="ink-face" src="/avatars/ink-0.gif" width="40" height="40" alt="" />
          <span id="you-name" class="you-name">—</span>
        </div>
        <div class="score-block" aria-live="polite">
          <span class="score-label">SCORE</span>
          <span id="score-today" class="score-num">0</span>
          <span id="score-pop" class="score-pop" aria-hidden="true"></span>
        </div>
      </header>

      <div class="round-bar">
        <span class="clock" aria-hidden="true"><span class="clock-hand"></span></span>
        <span class="round-read">
          <span id="round-now">1</span>
          <span class="round-slash">/</span>
          <span id="round-of">5</span>
        </span>
        <span class="prompt">WHICH IS HUMAN</span>
      </div>

      <div class="stage">
        <aside class="players" aria-label="You">
          <div class="player-row is-you">
            <img id="rail-face" class="ink-face" src="/avatars/ink-0.gif" width="40" height="40" alt="" />
            <div class="player-meta">
              <span id="rail-name" class="player-name">—</span>
              <span id="rail-score" class="player-score">0</span>
            </div>
          </div>
          <div class="player-row is-empty" aria-hidden="true"></div>
          <div class="player-row is-empty" aria-hidden="true"></div>
        </aside>

        <main class="desk" id="desk">
          <p class="topic" id="topic"></p>
          <p class="play-note" id="play-note" hidden></p>
          <div class="pair" id="pair">
            <button type="button" class="card" id="card-left" data-side="left">
              <span class="card-kicker">1</span>
              <span class="card-body" id="text-left"></span>
              <span class="ink-stamp" id="stamp-left" hidden>
                <span class="ink-stamp-face"></span>
              </span>
            </button>
            <button type="button" class="card" id="card-right" data-side="right">
              <span class="card-kicker">2</span>
              <span class="card-body" id="text-right"></span>
              <span class="ink-stamp" id="stamp-right" hidden>
                <span class="ink-stamp-face"></span>
              </span>
            </button>
          </div>
        </main>

        <aside class="today-strip" aria-hidden="true">
          <span class="stamp">5</span>
          <span class="stamp-label">today</span>
        </aside>
      </div>
    </div>

    <div class="done-booth" id="done-booth" hidden>
      <div class="done-panel">
        <img id="done-face" class="ink-face done-face" src="/avatars/ink-0.gif" width="72" height="72" alt="" />
        <h1 id="done-score">Today 0/5</h1>
        <p id="done-all" class="done-all">All-time 0</p>
        <ol class="podium" id="podium"></ol>
        <p class="done-wait">Play again tomorrow.</p>
        <a class="board-link" href="/board/">Board</a>
      </div>
    </div>

    <script type="module" src="/js/play.js?v=stamp-2"></script>
  </body>
</html>
