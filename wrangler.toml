name = "humane"
main = "src/worker.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
PUBLIC_ORIGIN = "https://humane.sakshamiscool3434.workers.dev"

# Local-only default. Production: wrangler secret put SESSION_SECRET
# SESSION_SECRET is read from .dev.vars or the secret store.

[[d1_databases]]
binding = "DB"
database_name = "humane"
database_id = "cafbf36f-9cee-437e-a57d-c3e33332cfab"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "ec56356aaebe49f1a5e4cf1d35467925"
