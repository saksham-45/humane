name = "humane"
main = "src/worker.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[build]
command = "npm run build:client"

[vars]
PUBLIC_ORIGIN = "https://humane.pages.dev"

# Local-only default. Production: wrangler secret put SESSION_SECRET
# SESSION_SECRET is read from .dev.vars or the secret store.

[[d1_databases]]
binding = "DB"
database_name = "humane"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "00000000-0000-0000-0000-000000000002"
